schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 项目
  bench —— Claude Code 的进程内 mod（开发者工作台面板）。
  引擎 hook 驱动，无构建步骤。全部逻辑在 hooks/register.tsx，
  类型契约在 types/index.d.ts，界面规范在 docs/UI-SPEC.md，
  引擎硬约束与三角色流程在 docs/SKILL.md。

  ## 流程（两层）
  外层 OpenSpec：/opsx:propose → /opsx:apply → /opsx:archive。
  内层三角色（仅在 apply 阶段，见 docs/SKILL.md §1）：
  架构师 + UI 设计师并行评审 → 功能开发工程师实施 → 架构师复审 + 三项验证。

  ## 规格边界
  - openspec/specs/ 只写**用户可感知的行为**：面板显示什么、交互怎么响应、数据何时刷新。
  - 引擎硬约束（$ 只能传模块顶层函数、只能静态 import、UI 符号集、列宽）已在
    docs/SKILL.md 与 docs/UI-SPEC.md 成文，**不要在 spec 里抄写**，改为在那里维护。
  - 代码模块拆分属于 design.md 的「实现约束」，不进 spec。

  ## Apply 执行协议（superpowers）
  apply 阶段 MUST 以 superpowers 技能执行；OpenSpec 仍是流程控制器，superpowers 只在
  apply 内部承担方案探索与实施：
  - 计划执行：`superpowers:executing-plans`，计划文件为 `openspec/changes/<change>/tasks.md`。
  - 行为实现：`superpowers:test-driven-development`（先写失败测试，再实现，再重构）。
  - 失败排查：`superpowers:systematic-debugging`，禁止猜测式修复。
  - 完成前验证：`superpowers:verification-before-completion`，报告实际输出。
  - 代码评审：`superpowers:requesting-code-review`；收到意见用 `superpowers:receiving-code-review`。
  - 收尾：`superpowers:finishing-a-development-branch`。
  - UI 前置门：任何 UI 评审、规范产出或 UI 实现前，MUST 先调用
    `frontend-design:frontend-design`，按 `docs/UI-SPEC.md` 与
    `.claude/skills/bench-ui/SKILL.md` 核对并补齐规范；缺口未补齐不得改 UI 代码。
  三角色流程保留为 apply 内层的评审结构；评审代理只读，写入方唯一。
  项目级入口见 `.claude/skills/openspec-apply-superpowers/SKILL.md`。

rules:
  proposal:
    - 写清「为什么现在做」和「不改会怎样」
    - 至少写一条 Non-goals（本变体不适用的场景）
  design:
    - 涉及 UI 的，逐条引用 docs/UI-SPEC.md 的章节号
    - 明确列出本次变更对引擎硬约束的影响（无影响也要写「无」）
  tasks:
    - 每个任务可独立验证，粒度不超过一个文件的一处改动
    - 最后一个任务固定为「三项验证：tsc / claude plugin test . / claude plugin validate .」
    - 新增 atom 的任务必须同时写明同步 types/index.d.ts 并递增 shape
    - apply 时 tasks.md 作为 `superpowers:executing-plans` 的计划；每个行为任务先写测试（`superpowers:test-driven-development`），测试失败再实现

operations:
  apply:
    guidance:
      - 进入 apply 前先读 change 的 proposal / design / specs / tasks，并确认 `openspec validate <change> --strict` 通过
      - 实施前先跑一遍三项验证，确认基线是绿的；不绿先停下报告
      - 按 `superpowers:executing-plans` 执行 tasks.md；每个行为任务走 `superpowers:test-driven-development`（red → green → refactor）
      - 遇到测试失败或意外行为，先用 `superpowers:systematic-debugging` 定位，不得猜测式修复
      - 新增/修改行为必须配 hooks/*.test.tsx，覆盖空态与一条数据
      - UI 相关任务：先调用 `frontend-design:frontend-design`，按 `docs/UI-SPEC.md` 与 `.claude/skills/bench-ui/SKILL.md` 的设计前置门核对并补齐规范，再实施 UI；未过门不得改 UI 代码
      - 声称完成前用 `superpowers:verification-before-completion` 跑三项验证并贴出实际输出，不得用「应该通过」代替
      - 完成后用 `superpowers:requesting-code-review` 做独立评审；收到意见走 `superpowers:receiving-code-review`
      - 收尾用 `superpowers:finishing-a-development-branch`；未获用户明确要求，不得自动 commit / push
  archive:
    guidance:
      - 归档前用 `superpowers:verification-before-completion` 复核三项验证与文档回归证据
      - 归档前确认三项验证全绿，且 docs/SKILL.md / UI-SPEC.md 已随行为变化更新
